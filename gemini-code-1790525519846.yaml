name: Sync Google Sheets Data

on:
  workflow_dispatch: # Allows you to trigger the sync manually with a button click
  schedule:
    - cron: '0 0 * * *' # Automatically runs every night at midnight

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/python-versions@v2
        with:
          python-version: '3.x'

      - name: Run data transformation script
        run: python process_sheets.py

      - name: Commit and push updated JSON files
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@github.com"
          git add dorset_history.json counties.json
          git status
          git commit -m "Auto-update map JSON data from Google Sheets" || exit 0
          git push